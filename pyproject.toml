[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv>=4.0.1",
    "datasets>=5.0.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=3.23.0",
    "pandas>=2.3.3",
    "protobuf>=7.36.2",
    "pypdf>=6.19.0",
    "pytz>=2026.4",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentencepiece>=0.2.2",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "tenacity>=9.1.4",
    "torch==2.8.0",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
